name: CI/CD - Build & Deploy OVP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Git pull
        run: |
          cd /opt/prototipo_OVP
          git checkout -- frontend/.env
          git pull origin main

      - name: Detener contenedores
        run: |
          cd /opt/prototipo_OVP/despliegue
          docker compose down

      - name: Build frontend
        run: |
          cd /opt/prototipo_OVP/despliegue
          docker compose build frontend

      - name: Build backend
        run: |
          cd /opt/prototipo_OVP/despliegue
          docker compose build backend

      - name: Iniciar servicios
        run: |
          cd /opt/prototipo_OVP/despliegue
          docker compose up -d

      - name: Limpiar imágenes
        run: docker image prune -f

      - name: Verificar estado
        run: |
          cd /opt/prototipo_OVP/despliegue
          docker compose ps